*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink)}body{font-family:Arial,Helvetica,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}button,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button,select{touch-action:manipulation}button:disabled{cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:5px}button{border:0}svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.sprite{position:absolute;width:0;height:0;overflow:hidden}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}.skip{position:fixed;z-index:10;top:12px;left:85px;transform:translateY(-160%);padding:12px;background:#eee;color:#111;border-radius:8px}.skip:focus{transform:none}

main{position:relative;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 49% 30%,#25252580,transparent 43%),var(--ink)}.atmosphere{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}.light-canvas{width:100%;height:100%;display:block}.beam{position:absolute;left:47.5%;top:0;width:260px;height:490px;transform:translateX(-50%);background:radial-gradient(ellipse 21px 190px at 50% 38%,#eeeeeea0,transparent 75%),radial-gradient(ellipse 70px 155px at 50% 61%,#dedede65,transparent 90%),radial-gradient(ellipse 158px 245px at 50% 59%,#bcbcbc38,transparent 96%);filter:blur(10px)}.beam:after{content:"";position:absolute;left:calc(50% - 2px);top:25px;width:4px;height:365px;background:linear-gradient(transparent,#fff2 28%,#fff6 70%,transparent);filter:blur(3px)}
.home{position:relative;z-index:2;left:-2.5%;width:min(820px,calc(100% - 88px));margin-inline:auto;padding-top:clamp(150px,25.5svh,320px);padding-bottom:100px;text-align:center}.hero-mark{height:104px;width:92px;margin-inline:auto;color:#eff0f3;filter:drop-shadow(0 1px 0 #fff8) drop-shadow(0 0 20px #ffffff55)}.hero-mark img{display:block;height:100%;width:100%;object-fit:contain}.home h1{font-family:Barlow,Arial,Helvetica,sans-serif;font-weight:500;font-size:clamp(2rem,1.2rem + 2.6vw,3.5rem);line-height:1.1;letter-spacing:-.025em;margin:32px 0 12px;text-wrap:balance}.home h1 span{display:inline-block;color:#cfcfcb}.home h1 .greeting-name{color:#fff}.greeting-note{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:12px;line-height:1.6;letter-spacing:.2em;text-transform:uppercase;color:#8f8f8f;margin:0 0 38px}
.composer{position:relative;border-radius:24px;text-align:left;border:1px solid #ffffff24;background:rgba(18,18,18,.35);box-shadow:0 16px 48px #0005;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:20px 15px 15px;min-height:175px;transition:box-shadow .2s}
.composer-glass{position:absolute;inset:-1px;border-radius:inherit;z-index:2;pointer-events:none}
.composer.glass-ready{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:transparent}
.composer-content{position:relative;z-index:3}
.composer:has(textarea:focus-visible){box-shadow:0 16px 48px #0005,inset 0 0 0 2px #c4c7ce}
textarea{display:block;resize:none;width:100%;height:77px;min-height:77px;padding:2px 3px;background:transparent;border:0;color:var(--paper);font-size:20px;line-height:1.4;letter-spacing:-.6px;border-radius:3px}textarea::placeholder{color:var(--glass-text);opacity:1}textarea:focus,textarea:focus-visible,textarea[aria-invalid=true]{outline:none;box-shadow:none}.composer:has(textarea[aria-invalid=true]){box-shadow:inset 0 0 0 2px #c4c7ce}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}.mode{position:relative;display:flex;align-items:center;border-radius:11px;height:44px;background:#ffffff09;border:1px solid #888;color:var(--glass-text)}.mode>svg:first-child{width:20px;height:20px;position:absolute;left:10px;pointer-events:none}.mode>svg:last-child{width:14px;height:14px;position:absolute;right:8px;pointer-events:none}.mode select{appearance:none;color:inherit;background:transparent;border:0;padding:0 27px 0 36px;height:42px;border-radius:10px;font-size:16px;cursor:pointer;min-width:98px}.mode option{background:#242424;color:white}.tools{display:flex;align-items:center;gap:4px}.tools .icon-button{color:#cacaca}.tools svg{width:21px;height:21px}.tools .send{border:1px solid #c7c7c7;width:42px;height:44px;margin-left:6px;background:radial-gradient(ellipse at 50% 120%,#cecece44,transparent 65%),linear-gradient(122deg,#8c8c8c55,#ffffff0a 57%,#bababa22);color:#fff;box-shadow:inset 1px 1px 3px #ffffff30,0 0 16px #ffffff0a}.tools button[aria-pressed=true]{background:#dedede;color:#111}.suggestions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:55px}.suggestion{display:flex;justify-content:center;align-items:center;gap:12px;min-height:50px;padding:12px 18px;border:1px solid transparent;border-radius:8px;color:#d0d0d0;background:linear-gradient(115deg,#191919,#181818e0) padding-box,linear-gradient(110deg,#707070,#242424 40%,#494949) border-box;font-size:14px;letter-spacing:-.45px;white-space:nowrap;transition:background .18s,color .18s,transform .18s}.suggestion svg{width:20px;height:20px}.suggestion:hover{background:linear-gradient(#303030,#222) padding-box,linear-gradient(110deg,#aaa,#555) border-box;color:#fff;transform:translateY(-2px)}.suggestion:active{transform:none}.status{margin:24px auto 0;max-width:650px;border:1px solid #626262;background:#1a1a1af2;padding:16px 20px;border-radius:12px;font-size:14px;line-height:1.6;color:#e2e2e2;text-align:left;overflow-wrap:anywhere}.status:empty{display:none}.attachment{font-size:14px;margin:10px 3px 0;max-width:100%;color:#f0f0f0;overflow-wrap:anywhere}.attachment:empty{display:none}.attachment button{margin-left:10px;background:none;min-height:28px;text-decoration:underline}.home .draft{white-space:pre-wrap;max-height:200px;overflow:auto}.toast-title{display:block;color:#fff;margin-bottom:4px;font-weight:600}
@media(max-width:65rem){.home{left:0;width:min(820px,calc(100% - 64px))}.beam{left:50%}.suggestion{padding-inline:14px;gap:9px}}
/* The composer toolbar needs more room than a narrow side rail leaves. */
@media(max-width:42rem){:root{--rail:56px}.rail{padding:15px 6px 18px}.rail-logo{margin-bottom:20px}.rail-logo img{height:30px}.rail nav{gap:10px}.home{width:calc(100% - 36px);padding-top:clamp(115px,22svh,185px);padding-bottom:50px}.hero-mark{height:80px;width:70px}.home h1{margin:26px 0 10px;font-size:2.125rem;letter-spacing:-.025em;line-height:1.1}.greeting-note{font-size:11px;margin-bottom:28px;margin-inline:auto}.beam{top:0;height:410px;width:190px}.composer{padding:16px 11px 11px;min-height:176px;border-radius:18px}textarea{font-size:16px;letter-spacing:-.3px;height:80px}.toolbar{gap:2px;margin-top:12px}.tools{gap:0}.tools .icon-button{width:44px}.tools .send{width:36px;margin-left:2px}.mode select{font-size:16px;padding-inline:29px 21px;min-width:86px}.mode>svg:first-child{left:7px;width:17px}.mode>svg:last-child{right:5px;width:12px}.suggestions{gap:9px;margin-top:30px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.suggestion{min-height:49px;padding:9px 5px;font-size:12px;letter-spacing:-.25px;gap:7px;white-space:normal;text-align:left}.suggestion svg{width:17px;height:17px}.status{font-size:14px;padding:13px}.rail .icon-button{width:40px;height:42px}}
@media(max-width:23rem){.home{width:calc(100% - 24px)}.home h1{font-size:1.625rem}.toolbar{flex-wrap:wrap;gap:10px}.tools{margin-left:auto}.composer{min-height:190px}.suggestion{gap:5px;font-size:12px;padding:8px 4px}.suggestion svg{width:15px}}
@media(max-height:600px) and (min-width:42rem){.home{padding-top:70px;padding-bottom:55px}.hero-mark{height:75px;width:66px}.home h1{margin:18px 0 8px}.greeting-note{margin-bottom:24px}.suggestions{margin-top:28px}.rail nav{gap:4px}.rail-logo{margin-bottom:8px}.beam{top:-130px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}.suggestion:hover{transform:none}}
@media(prefers-reduced-transparency:reduce){.composer{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:#22242a}.composer:before{display:none}}
@media(forced-colors:active){.atmosphere{display:none}.composer,.suggestion,.mode,.icon-button{border:1px solid ButtonText}.hero-mark{filter:none}.home h1 span,.home h1 .greeting-name{background:none;color:CanvasText}.rail{border-right:1px solid CanvasText}}
@media(prefers-reduced-transparency:reduce),(forced-colors:active){#aurora-liquidgl-canvas{display:none!important}.composer.glass-ready{background:#22242a!important}}

/* Scoped floating material editor; never included in the optical snapshot. */
.composer:after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgb(8 8 10 / var(--glass-tint,0));pointer-events:none;z-index:2}
@media(forced-colors:active){.composer:after{display:none}}

/* Separation lives above the optical lens; it never blurs the input or intercepts clicks. */
.composer{box-shadow:none}
.composer:before{content:"";display:block;position:absolute;inset:-1px;border-radius:inherit;z-index:4;pointer-events:none;box-shadow:0 0 0 var(--h-lineWidth,1px) rgb(230 233 240 / var(--h-line,.26)),0 var(--h-drop,18px) var(--h-blur,40px) rgb(0 0 0 / var(--h-shadow,.65)),inset 0 1px 0 rgb(255 255 255 / var(--h-sheen,.12))}
.composer:has(textarea:focus-visible):before,.composer:has(textarea[aria-invalid=true]):before{outline:none;box-shadow:inset 0 0 0 2px #c4c7ce,0 var(--h-drop,18px) var(--h-blur,40px) rgb(0 0 0 / var(--h-shadow,.65))}
.suggestion{background:linear-gradient(135deg,rgb(var(--h-buttonFill,24) var(--h-buttonFill,24) var(--h-buttonFill,24)),#101113);border:1px solid rgb(220 223 230 / var(--h-buttonLine,.18));border-radius:var(--h-radius,12px);box-shadow:0 6px 16px rgb(0 0 0 / var(--h-buttonShadow,.25)),inset 0 1px 0 #ffffff08;color:#d0d0d0}
.suggestion:hover{background:#2e3035;border-color:#777b86;color:#fff}
.suggestions{margin-top:var(--h-gap,40px)}
@media(max-width:42rem){.suggestions{margin-top:min(var(--h-gap,40px),40px)}.home{padding-bottom:110px}}
@media(forced-colors:active){.composer:before{box-shadow:none;border:1px solid CanvasText}.suggestion{background:Canvas;color:ButtonText;border-color:ButtonText;box-shadow:none}.composer:has(textarea:focus-visible):before{outline:2px solid Highlight}}
:root{--h-line:.17;--h-lineWidth:1px;--h-shadow:.9;--h-blur:40px;--h-drop:18px;--h-sheen:.18;--h-buttonFill:16;--h-buttonLine:.16;--h-buttonShadow:.25;--h-radius:12px;--h-gap:40px}
.composer{--glass-tint:.04}
</style>

      if (isNaN(w) || isNaN(h)) {
        if (typeof el.offsetWidth === "number" && el.offsetWidth) {
          return { w: el.offsetWidth, h: el.offsetHeight };
        }
        const r = el.getBoundingClientRect();
        return { w: r.width, h: r.height };
      }
      if (style.boxSizing !== "border-box") {
        w +=
          parseFloat(style.paddingLeft) +
          parseFloat(style.paddingRight) +
          parseFloat(style.borderLeftWidth) +
          parseFloat(style.borderRightWidth);
        h +=
          parseFloat(style.paddingTop) +
          parseFloat(style.paddingBottom) +
          parseFloat(style.borderTopWidth) +
          parseFloat(style.borderBottomWidth);
      }
      return { w, h };
    }

    function isStackingContext(el, style) {
      if (style.position !== "static" && style.zIndex !== "auto") return true;
      if (style.position === "fixed" || style.position === "sticky")
        return true;
      if (parseFloat(style.opacity) < 1) return true;
      if (style.transform && style.transform !== "none") return true;
      if (style.filter && style.filter !== "none") return true;
      if (style.isolation === "isolate") return true;
      if (style.mixBlendMode && style.mixBlendMode !== "normal") return true;
      if (/paint|layout|strict|content/.test(style.contain || "")) return true;
      if (style.webkitOverflowScrolling === "touch") return true;
      return false;
    }

    function measureRuns(el, style) {
      const runs = [];
      if (style.visibility !== "visible") return runs;

      const transform = style.textTransform;
      const kids = el.childNodes;
      let range = null;

      for (let i = 0; i < kids.length; i++) {
        const textNode = kids[i];
        if (textNode.nodeType !== 3) continue;
        const raw = textNode.data;
        if (!raw || !raw.trim()) continue;
        if (!range) range = document.createRange();

        const re = /\S+/g;
        let match;
        while ((match = re.exec(raw)) !== null) {
          try {
            range.setStart(textNode, match.index);
            range.setEnd(textNode, match.index + match[0].length);
          } catch (e) {
            continue;
          }
          const rects = range.getClientRects();
          if (!rects.length) continue;

          let text = match[0];
          if (transform === "uppercase") text = text.toUpperCase();
          else if (transform === "lowercase") text = text.toLowerCase();
          else if (transform === "capitalize") {
            text = text.replace(/\b\w/g, (c) => c.toUpperCase());

          if (rects.length === 1) {
            const r = rects[0];
            runs.push({
              text,
              left: r.left,
              top: r.top,
              right: r.right,
              height: r.height,
            });
          } else {
            const per = Math.ceil(text.length / rects.length);
            for (let k = 0; k < rects.length; k++) {
              const slice = text.substr(k * per, per);
              if (!slice) continue;
              const r = rects[k];
              runs.push({
                text: slice,
                left: r.left,
                top: r.top,
                right: r.right,
                height: r.height,

      const tag = el.tagName;

    function discoverAssets(el, style) {
      const layers = style.backgroundImage;
      if (layers && layers !== "none") layerUrls(layers).forEach(loadImage);
      const tag = el.tagName;
      if (tag === "IMG") {

        if (src && !usableDomImage(el)) loadImage(src);

    function buildNode(el, parent, clips, ignore) {
      if (ignore && ignore(el)) return null;
      const style = getComputedStyle(el);
      if (style.display === "none") return null;

      const size = borderBoxSize(el, style);
      const rect = el.getBoundingClientRect();
      const B = parent ? parent.m : IDENT;
      const Blin = [B[0], B[1], B[2], B[3], 0, 0];
      const own = parseMatrix(style.transform);
      const N = own || IDENT;
      const Nlin = [N[0], N[1], N[2], N[3], 0, 0];
      const BN = mul(Blin, Nlin);

      let x;
      let y;
      let m;
      if (!own && (!parent || parent.untransformed)) {
        x = rect.left;
        y = rect.top;
        m = IDENT;
      } else {
        const o = parseOrigin(style.transformOrigin);
        const no = apply(Nlin, o[0], o[1]);
        const tv = [o[0] - no[0] + N[4], o[1] - no[1] + N[5]];
        const bt = apply(Blin, tv[0], tv[1]);
        const C = [bt[0] + B[4], bt[1] + B[5]];
        let minX = Infinity;
        let minY = Infinity;
        const corners = [
          [0, 0],
          [size.w, 0],
          [0, size.h],
          [size.w, size.h],
        ];
        for (let i = 0; i < corners.length; i++) {
          const p = apply(BN, corners[i][0], corners[i][1]);
          if (p[0] < minX) minX = p[0];
          if (p[1] < minY) minY = p[1];

        const inv = invertLinear(Blin);
        if (!inv) return null;
        const u = apply(inv, rect.left - minX - C[0], rect.top - minY - C[1]);
        x = u[0];
        y = u[1];
        m = [BN[0], BN[1], BN[2], BN[3], C[0], C[1]];
      }

      const radii = parseRadii(style, size.w, size.h);
      const node = {
        el,
        style,
        x,
        y,
        w: size.w,
        h: size.h,
        m,
        radii,
        clips,
        opacity: parseFloat(style.opacity),
        untransformed: !own && (!parent || parent.untransformed),
        children: [],

      if (
        CLIP_OVERFLOW.test(style.overflowX) ||
        CLIP_OVERFLOW.test(style.overflowY)

        const bb = parseFloat(style.borderBottomWidth);

          {
            m,
            x: x + bl,
            y: y + bt,
            w: Math.max(0, size.w - bl - br),
            h: Math.max(0, size.h - bt - bb),
            radii: insetRadii(radii, bt, br, bb, bl),

    function newStack(node) {

        negative: [],
        zeroOrAuto: [],

    function collect(node, stack, ignore) {

      for (let i = 0; i < kids.length; i++) {
        const child = buildNode(kids[i], node, node.childClips, ignore);
        if (!child) continue;
        const cs = child.style;
        if (isStackingContext(child.el, cs)) {
          const sub = newStack(child);
          collect(child, sub, ignore);
          const z =
            cs.position !== "static" && cs.zIndex !== "auto"

          else if (z > 0) stack.positive.push({ z, sub });

          collect(child, sub, ignore);
          stack.zeroOrAuto.push(sub);

            ctx,
            node.x + spread,
            node.y + spread,

          const gy = node.y - node.h - blur * 2 - Math.abs(dy) - spread - 100;
          ctx.rect(
            gx,
            gy,
            node.w * 3 + blur * 4 + Math.abs(dx) * 2 + spread * 2 + 200,
            node.h * 3 + blur * 4 + Math.abs(dy) * 2 + spread * 2 + 200,

          ctx.shadowOffsetX = dx;
          ctx.shadowOffsetY = dy;
          ctx.shadowBlur = blur;
          ctx.fillStyle = "#000";
          ctx.beginPath();
          tracePath(
            ctx,
            node.x - spread,
            node.y - spread,
            node.w + spread * 2,
            node.h + spread * 2,
            insetRadii(node.radii, -spread, -spread, -spread, -spread),

    Painter.prototype.background = function (node) {
      const style = node.style;

      if (isTransparent(style.backgroundColor) && !hasImages) return;

      const clipList = splitTopLevel(style.backgroundClip || "border-box");
      const clipBox = boxFor(clipList[clipList.length - 1], node, style);
      if (clipBox.w <= 0 || clipBox.h <= 0) return;

      if (!isTransparent(style.backgroundColor)) {
        this.space(node.m);
        ctx.beginPath();
        tracePath(
          ctx,
          clipBox.x,
          clipBox.y,
          clipBox.w,
          clipBox.h,
          clipBox.radii,
        );
        ctx.fillStyle = style.backgroundColor;
        ctx.fill();

      const originList = splitTopLevel(style.backgroundOrigin || "padding-box");
      const sizeList = splitTopLevel(style.backgroundSize || "auto");

        const lClip = boxFor(pick(clipList, i), node, style);
        const origin = boxFor(pick(originList, i), node, style);
        if (lClip.w <= 0 || lClip.h <= 0) continue;

        ctx.save();
        this.space(node.m);
        ctx.beginPath();
        tracePath(ctx, lClip.x, lClip.y, lClip.w, lClip.h, lClip.radii);

        const urlMatch = layer.match(/^url\((['"]?)(.*?)\1\)$/);

              ctx,
              layer,
              origin.x,
              origin.y,
              origin.w,
              origin.h,

                ctx.scale(1, made.scaleY);
                ctx.translate(-made.cx, -made.cy);
                ctx.fillRect(
                  lClip.x,
                  made.cy + (lClip.y - made.cy) * inv,
                  lClip.w,
                  lClip.h * inv,

                ctx.fillRect(lClip.x, lClip.y, lClip.w, lClip.h);
              }

          } catch (e) {}
        }
        ctx.restore();
      }
    };

    Painter.prototype.tile = function (img, area, size, position, repeat) {

      const nw = img.naturalWidth || img.width;
      const nh = img.naturalHeight || img.height;

      let dh;
      const ratio = nw / nh;
      if (size === "cover" || size === "contain") {
        const areaRatio = area.w / area.h;
        const wide = size === "cover" ? areaRatio < ratio : areaRatio > ratio;
        if (wide) {
          dh = area.h;
          dw = dh * ratio;
        } else {
          dw = area.w;
          dh = dw / ratio;
        }
      } else {
        const tokens = (size || "auto").split(/\s+/);
        const sx = tokens[0] || "auto";
        const sy = tokens[1] || "auto";
        if (sx === "auto" && sy === "auto") {
          dw = nw;
          dh = nh;
        } else if (sx === "auto") {
          dh = resolveLength(sy, area.h);
          dw = dh * ratio;
        } else if (sy === "auto") {
          dw = resolveLength(sx, area.w);
          dh = dw / ratio;
        } else {
          dw = resolveLength(sx, area.w);
          dh = resolveLength(sy, area.h);
        }
      }
      if (dw <= 0 || dh <= 0) return;

      const offset = resolvePosition(
        (position || "0% 0%").split(/\s+/),
        area.w,
        area.h,
        dw,
        dh,
      );
      const ox = area.x + offset[0];
      const oy = area.y + offset[1];

      if (repeat === "no-repeat") {
        ctx.drawImage(img, ox, oy, dw, dh);
        return;

      const repeatX = repeat !== "repeat-y";
      const repeatY = repeat !== "repeat-x";
      const mode =
        repeatX && repeatY ? "repeat" : repeatX ? "repeat-x" : "repeat-y";
      const pattern = ctx.createPattern(img, mode);

          repeatX ? area.x : ox,
          repeatY ? area.y : oy,
          repeatX ? area.w : dw,
          repeatY ? area.h : dh,

      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(dw / nw, dh / nh);
      ctx.fillStyle = pattern;
      ctx.fillRect(
        ((repeatX ? area.x : ox) - ox) / (dw / nw),
        ((repeatY ? area.y : oy) - oy) / (dh / nh),
        (repeatX ? area.w : dw) / (dw / nw),
        (repeatY ? area.h : dh) / (dh / nh),

        box.h,
        dw,
        dh,
